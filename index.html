<!doctype html>
<html lang="zh-Hant-TW" data-theme="dark" data-font="md">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>SkillForge X v20.1｜安全治理版</title>
  <style>
    :root{--bg:#08111f;--panel:#111d30;--panel2:#17263d;--text:#eff7ff;--muted:#9eb1c9;--line:#2a3e59;--cyan:#64dff4;--gold:#f4c76d;--red:#ff8291;--green:#63dfa2;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);font-size:16px;color-scheme:dark}
    [data-theme="light"]{--bg:#f3f7fc;--panel:#fff;--panel2:#e8f0f9;--text:#172235;--muted:#526a87;--line:#cbd8e7;color-scheme:light}
    [data-font="sm"]{font-size:15px}[data-font="lg"]{font-size:18px}[data-font="xl"]{font-size:20px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
    button,input,textarea,select{font:inherit}button{min-width:44px;min-height:44px;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
    .shell{min-height:100dvh;padding:max(12px,var(--safe-top)) 14px calc(82px + var(--safe-bottom));max-width:960px;margin:auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.mark{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);display:grid;place-items:center;background:linear-gradient(135deg,#17314a,#4a3822)}h1{font-size:1rem;margin:0}.sub{font-size:.78rem;color:var(--muted);margin-top:3px}.actions,.row{display:flex;flex-wrap:wrap;gap:10px}.icon,.btn,.card{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:15px}.icon{padding:0 12px}.btn{padding:10px 15px;font-weight:800}.primary{border-color:#397a8d;background:#143b4d}.danger{border-color:#7c3b48;color:#ffd8de}.ghost{background:transparent}
    main{padding-top:34px}.view[hidden]{display:none}.hero{text-align:center;padding:9vh 0 26px}.badge{display:inline-block;color:var(--gold);font-weight:900;border:1px solid var(--line);border-radius:999px;padding:9px 14px}.hero h2{font-size:clamp(2.3rem,12vw,4.8rem);margin:20px 0 8px;line-height:1}.hero p{color:var(--muted);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tool{min-height:150px;padding:18px;text-align:left}.tool b{display:block;font-size:1.05rem;margin:10px 0 6px}.tool span{color:var(--muted);font-size:.86rem;line-height:1.5}.tool .emoji{font-size:1.7rem}
    .page-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}.page-head h2{margin:0;font-size:1.25rem}.panel{border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:16px;margin-bottom:14px}.panel h3{margin:0 0 12px;font-size:1rem}.field{margin-bottom:13px}label{display:block;font-weight:800;font-size:.9rem;margin-bottom:7px}input,textarea,select{width:100%;min-height:48px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}textarea{min-height:150px;resize:vertical;line-height:1.6}.output{white-space:pre-wrap;line-height:1.65;color:var(--text)}.muted{color:var(--muted)}
    .archive{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:16px;padding:13px}.item h3{margin:0 0 6px;font-size:.98rem}.item p{margin:0 0 10px;color:var(--muted);font-size:.82rem}.status{padding:11px 13px;border-radius:14px;border:1px solid var(--line);margin-bottom:12px}.status.safe{border-color:#327154;color:var(--green)}.status.caution{border-color:#866928;color:var(--gold)}.status.danger{border-color:#824351;color:var(--red)}
    nav{position:fixed;left:50%;bottom:calc(10px + var(--safe-bottom));transform:translateX(-50%);width:min(620px,calc(100% - 18px));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(16px);border-radius:20px}nav button{border:0;background:transparent;color:var(--muted);border-radius:14px;font-size:.76rem;font-weight:800}nav button.active{background:var(--panel2);color:var(--text)}
    dialog{width:min(520px,calc(100% - 24px));border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text);padding:18px}dialog::backdrop{background:#0009}dialog h2{margin-top:0}.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 15px;border-radius:14px;font-weight:800;z-index:5}
    @media(max-width:430px){.shell{padding-left:12px;padding-right:12px}.hero{padding-top:6vh}.tool{min-height:132px}.actions .hide-mobile{display:none}}
    @media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<div class="shell">
  <header><div class="brand"><div class="mark" aria-hidden="true">🛡️</div><div><h1>SkillForge X v20.1</h1><div class="sub">安全治理版｜先審核，再轉換</div></div></div><div class="actions"><button class="icon" id="fontBtn" aria-label="調整字體">字</button><button class="icon" id="themeBtn" aria-label="切換亮暗色">☼</button><button class="icon" id="helpBtn" aria-label="使用說明">?</button></div></header>
  <main>
    <section class="view" data-view="home"><div class="hero"><span class="badge">智萃萬象，智粹成器</span><h2>SkillForge X</h2><p>把內容先守門，再鍛造成可重複使用的技能。</p></div><div class="grid">
      <button class="card tool" data-go="forge"><span class="emoji">⚒️</span><b>貼上鍛造</b><span>內容轉為 Prompt、SOP 或知識卡</span></button>
      <button class="card tool" data-go="gate"><span class="emoji">🛡️</span><b>深度守門</b><span>標出宣稱、敏感資訊與待查證處</span></button>
      <button class="card tool" data-go="archive"><span class="emoji">💎</span><b>晶體歸檔</b><span>本機保存、匯入、匯出與復原</span></button>
      <button class="card tool" data-go="quality"><span class="emoji">✓</span><b>品質閘門</b><span>檢查儲存、觸控與資料可攜性</span></button>
    </div></section>
    <section class="view" data-view="forge" hidden><div class="page-head"><button class="icon" data-go="home" aria-label="返回首頁">←</button><h2>貼上鍛造</h2></div><div class="panel"><div class="field"><label for="forgeText">來源內容</label><textarea id="forgeText" placeholder="貼上文章、需求或筆記；資料只在此瀏覽器處理。"></textarea></div><div class="field"><label for="forgeType">成果類型</label><select id="forgeType"><option value="prompt">AI 提示詞</option><option value="sop">SOP</option><option value="summary">摘要卡</option><option value="knowledge">知識卡</option></select></div><button class="btn primary" id="forgeBtn">產生成品</button></div><div class="panel"><h3>成品</h3><div id="forgeOutput" class="output muted">尚未產生成品。</div><div class="row" style="margin-top:12px"><button class="btn" id="copyForgeBtn">複製</button><button class="btn" id="saveForgeBtn">存入晶體</button><button class="btn" id="mdForgeBtn">下載 MD</button></div></div></section>
    <section class="view" data-view="gate" hidden><div class="page-head"><button class="icon" data-go="home" aria-label="返回首頁">←</button><h2>深度守門</h2></div><div class="panel"><div class="field"><label for="sourceTitle">來源標題</label><input id="sourceTitle" maxlength="200"></div><div class="field"><label for="sourceUrl">來源網址（僅允許 HTTP/HTTPS）</label><input id="sourceUrl" type="url" inputmode="url"></div><div class="field"><label for="sourceText">摘要或逐字稿</label><textarea id="sourceText"></textarea></div><button class="btn primary" id="analyzeBtn">開始檢查</button></div><div class="panel"><div id="gateStatus" class="status caution">🟡 尚未分析</div><div id="gateOutput" class="output muted">燈號是初篩，不等於外部事實查證。</div><div class="row" style="margin-top:12px"><button class="btn" id="saveGateBtn">存入晶體</button><button class="btn" id="mdGateBtn">下載 MD</button></div></div></section>
    <section class="view" data-view="archive" hidden><div class="page-head"><button class="icon" data-go="home" aria-label="返回首頁">←</button><h2>晶體歸檔</h2></div><div class="panel"><div class="row"><button class="btn" id="exportBtn">匯出 JSON</button><button class="btn" id="importBtn">匯入 JSON</button><input id="importFile" type="file" accept="application/json,.json" hidden><button class="btn danger" id="clearBtn">清空歸檔</button></div></div><div id="archiveList" class="archive"></div></section>
    <section class="view" data-view="quality" hidden><div class="page-head"><button class="icon" data-go="home" aria-label="返回首頁">←</button><h2>品質閘門</h2></div><div class="panel"><button class="btn primary" id="qualityBtn">執行自檢</button><div id="qualityOutput" class="output muted" style="margin-top:12px">尚未執行。</div></div></section>
  </main>
</div>
<nav aria-label="主要功能"><button data-go="home" class="active">首頁</button><button data-go="forge">鍛造</button><button data-go="gate">守門</button><button data-go="archive">晶體</button></nav>
<dialog id="confirmDialog" aria-labelledby="confirmTitle"><h2 id="confirmTitle">確認操作</h2><p id="confirmText"></p><div class="row"><button class="btn" id="cancelConfirm">取消</button><button class="btn danger" id="acceptConfirm">確認</button></div></dialog>
<dialog id="helpDialog" aria-labelledby="helpTitle"><h2 id="helpTitle">三步開始</h2><ol><li>選擇「鍛造」或「守門」。</li><li>貼上內容並產生結果。</li><li>確認後存入晶體；可用 JSON 備份還原。</li></ol><p class="muted">所有資料預設只留在本機，不會自動上傳。</p><button class="btn" id="closeHelp">知道了</button></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(()=>{'use strict';
const APP='skillforge-x',SCHEMA=1,KEY='zhicui.skillforge.v20_1.archive',UI='zhicui.skillforge.v20_1.ui';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];let lastForge='',lastGate=null,undo=null;
const safeStore={read(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch{return f}},write(k,v){localStorage.setItem(k,JSON.stringify(v))}};
function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function ui(){return safeStore.read(UI,{theme:'dark',font:'md'})}function saveUi(p){const n={...ui(),...p};safeStore.write(UI,n);document.documentElement.dataset.theme=n.theme;document.documentElement.dataset.font=n.font;$('#themeBtn').textContent=n.theme==='dark'?'☼':'☾'}
function go(name){$$('.view').forEach(v=>v.hidden=v.dataset.view!==name);$$('nav [data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===name));scrollTo({top:0,behavior:'smooth'});if(name==='archive')renderArchive()}
function confirmAction(message){return new Promise(resolve=>{const d=$('#confirmDialog'),events=new AbortController();$('#confirmText').textContent=message;const done=v=>{events.abort();d.close();resolve(v)};$('#cancelConfirm').addEventListener('click',()=>done(false),{signal:events.signal});$('#acceptConfirm').addEventListener('click',()=>done(true),{signal:events.signal});d.addEventListener('cancel',e=>{e.preventDefault();done(false)},{signal:events.signal});d.showModal()})}
function archive(){const a=safeStore.read(KEY,[]);return Array.isArray(a)?a:[]}function setArchive(a){safeStore.write(KEY,a.slice(0,100))}
function validUrl(raw){if(!raw)return'';try{const u=new URL(raw);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
function download(name,text,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff',text],{type:type||'text/plain;charset=utf-8'}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),0)}
function forge(){const text=$('#forgeText').value.trim();if(!text)return toast('請先貼上內容');const type=$('#forgeType').value;const title={prompt:'AI 提示詞',sop:'SOP',summary:'摘要卡',knowledge:'知識卡'}[type];lastForge=`# ${title}\n\n## 任務\n請先檢查來源內容的風險與資料缺口，再轉換為${title}。\n\n## 來源內容\n${text}\n\n## 品質限制\n- 使用台灣繁體中文\n- 不補寫來源沒有的事實\n- 推測、資料不足與需查證處必須明示\n- 涉及付款、個資或外部執行時先取得確認`;$('#forgeOutput').textContent=lastForge;$('#forgeOutput').classList.remove('muted');toast('已產生成品')}
const rules=[['保證賺',35],['穩賺',30],['月賺',24],['驗證碼',35],['帳密',32],['銀行',30],['破解',35],['白嫖',16],['免費',10],['一鍵',10],['小白',8],['bit.ly',25]];
function analyze(){const title=$('#sourceTitle').value.trim(),text=$('#sourceText').value.trim(),raw=$('#sourceUrl').value.trim(),url=validUrl(raw);if(raw&&url===null)return toast('網址只允許 HTTP 或 HTTPS');if(!title&&!text&&!url)return toast('請先提供來源');const combined=title+'\n'+text,hits=rules.filter(r=>combined.includes(r[0])),score=Math.min(100,hits.reduce((n,r)=>n+r[1],0)+(text.length<40?12:0));const level=score>=70?'danger':score>=21?'caution':'safe',icon=level==='danger'?'🔴':level==='caution'?'🟡':'🟢',label=level==='danger'?'可疑':level==='caution'?'需留意':'相對安全';lastGate={id:crypto.randomUUID(),kind:'gate',createdAt:new Date().toISOString(),title:title||'未命名守門報告',url,score,level,hits:hits.map(r=>r[0]),text};const md=`# SkillForge X 守門報告\n\n- 燈號：${icon} ${label}\n- 風險分數：${score}/100\n- 來源標題：${lastGate.title}\n- 來源網址：${url||'未提供'}\n\n## 偵測項目\n${hits.length?hits.map(r=>'- '+r[0]).join('\n'):'- 未偵測明顯高風險詞'}\n\n## 判定邊界\n本報告僅為關鍵詞初篩；價格、平台條款、收益及外部事實仍需官方來源查證。`;lastGate.markdown=md;$('#gateStatus').className='status '+level;$('#gateStatus').textContent=`${icon} ${label}｜${score}/100`;$('#gateOutput').textContent=md;$('#gateOutput').classList.remove('muted')}
function saveItem(item){if(!item)return toast('尚無可儲存內容');const a=archive();a.unshift(item);setArchive(a);toast('已存入晶體')}
function renderArchive(){const root=$('#archiveList'),a=archive();root.replaceChildren();if(!a.length){const p=document.createElement('p');p.className='muted';p.textContent='尚無晶體。';root.append(p);return}a.forEach((x,i)=>{const el=document.createElement('article');el.className='item';const h=document.createElement('h3');h.textContent=x.title||'未命名晶體';const p=document.createElement('p');p.textContent=`${x.kind==='gate'?'守門報告':'技能成品'}｜${new Date(x.createdAt).toLocaleString('zh-TW')}`;const del=document.createElement('button');del.className='btn danger';del.textContent='刪除';del.addEventListener('click',async()=>{if(!await confirmAction('確定刪除此晶體？刪除後可在本次操作中復原。'))return;const b=archive();undo=b[i];b.splice(i,1);setArchive(b);renderArchive();toast('已刪除；按「復原上次刪除」可取回')});el.append(h,p,del);root.append(el)});if(undo){const b=document.createElement('button');b.className='btn';b.textContent='復原上次刪除';b.addEventListener('click',()=>{const a=archive();a.unshift(undo);undo=null;setArchive(a);renderArchive();toast('已復原')});root.prepend(b)}}
function validImport(v){if(!v||v.app!==APP||v.schemaVersion!==SCHEMA||!Array.isArray(v.items)||v.items.length>100)return false;return v.items.every(x=>x&&typeof x==='object'&&typeof x.id==='string'&&typeof x.kind==='string'&&typeof x.createdAt==='string'&&typeof x.title==='string')}
async function importJson(file){if(!file||file.size>1024*1024)return toast('檔案不可超過 1MB');try{const v=JSON.parse(await file.text());if(!validImport(v))throw Error();if(!await confirmAction(`將匯入 ${v.items.length} 筆資料並取代目前歸檔；要繼續嗎？`))return;const backup=archive();setArchive(v.items);undo={restoreArchive:backup};renderArchive();toast('匯入完成')}catch{toast('匯入失敗：格式或 UTF-8 JSON 不符合規格')}}
function quality(){const targets=$$('button,input,textarea,select').filter(x=>!x.hidden&&x.offsetParent!==null),small=targets.filter(x=>{const r=x.getBoundingClientRect();return r.width<44||r.height<44});const checks=[['無 inline onclick',!document.querySelector('[onclick]')],['互動控制至少 44px',small.length===0],['LocalStorage 可寫',(()=>{try{localStorage.setItem('__q','1');localStorage.removeItem('__q');return true}catch{return false}})()],['Safe area 已設定',getComputedStyle(document.documentElement).getPropertyValue('--safe-bottom').includes('safe-area')],['JSON 匯出 schema',validImport({app:APP,schemaVersion:SCHEMA,items:archive()})]];$('#qualityOutput').textContent=checks.map(c=>`${c[1]?'PASS':'FAIL'}｜${c[0]}${!c[1]&&c[0].includes('44')?`（${small.length} 個）`:''}`).join('\n')}
$$('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));$('#forgeBtn').addEventListener('click',forge);$('#copyForgeBtn').addEventListener('click',()=>lastForge?navigator.clipboard.writeText(lastForge).then(()=>toast('已複製')):toast('尚無成品'));$('#saveForgeBtn').addEventListener('click',()=>saveItem(lastForge?{id:crypto.randomUUID(),kind:'forge',createdAt:new Date().toISOString(),title:'AI 技能成品',markdown:lastForge}:null));$('#mdForgeBtn').addEventListener('click',()=>lastForge?download('skillforge-output.md',lastForge):toast('尚無成品'));$('#analyzeBtn').addEventListener('click',analyze);$('#saveGateBtn').addEventListener('click',()=>saveItem(lastGate));$('#mdGateBtn').addEventListener('click',()=>lastGate?download('skillforge-report.md',lastGate.markdown):toast('尚無報告'));$('#exportBtn').addEventListener('click',()=>download('skillforge-backup.json',JSON.stringify({app:APP,schemaVersion:SCHEMA,exportedAt:new Date().toISOString(),items:archive()},null,2),'application/json;charset=utf-8'));$('#importBtn').addEventListener('click',()=>$('#importFile').click());$('#importFile').addEventListener('change',e=>importJson(e.target.files[0]));$('#clearBtn').addEventListener('click',async()=>{if(!await confirmAction('確定清空全部晶體？系統會保留本次復原點。'))return;undo={restoreArchive:archive()};setArchive([]);renderArchive();toast('已清空')});$('#qualityBtn').addEventListener('click',quality);$('#themeBtn').addEventListener('click',()=>saveUi({theme:ui().theme==='dark'?'light':'dark'}));$('#fontBtn').addEventListener('click',()=>{const a=['sm','md','lg','xl'],i=a.indexOf(ui().font);saveUi({font:a[(i+1)%a.length]});toast('字體大小已保存')});$('#helpBtn').addEventListener('click',()=>$('#helpDialog').showModal());$('#closeHelp').addEventListener('click',()=>$('#helpDialog').close());document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#confirmDialog').open&&!$('#helpDialog').open)go('home')});saveUi(ui());go('home');
})();
</script>
</body></html>
